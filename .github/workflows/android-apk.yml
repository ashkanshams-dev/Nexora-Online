name: Flutter APK

on:
  push:
    branches: [flutter]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Engine lockstep parity (Dart vs original TS engine)
        run: dart run tool/parity_check.dart | tee parity.txt && grep -q '^OK' parity.txt

      - name: Build release APK (signed with the debug keystore — for testing)
        run: flutter build apk --release --target-platform android-arm64,android-arm --build-number ${{ github.run_number }}

      - name: Collect APK
        run: |
          mkdir -p dist-apk
          cp build/app/outputs/flutter-apk/app-release.apk dist-apk/NEXORA-flutter.apk
          ls -la dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-flutter-apk
          path: dist-apk/NEXORA-flutter.apk
          if-no-files-found: error

      - name: Read version
        id: ver
        run: |
          echo "ver=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
          { echo 'notes<<EOF'; [ -f RELEASE_NOTES.md ] && cat RELEASE_NOTES.md; echo EOF; } >> "$GITHUB_OUTPUT"

      # pre-release only: the RN app's in-app updater follows the *latest* release, so Flutter test builds never
      # replace it until the port is promoted.
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-build-${{ github.run_number }}
          name: NEXORA Flutter ${{ steps.ver.outputs.ver }} (build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body: |
            Flutter + Flame test build of NEXORA (release APK signed with the debug keystore).
            Commit: ${{ github.sha }} (branch flutter)
            Install: download the APK on your Android phone and allow "install unknown apps".
          files: dist-apk/NEXORA-flutter.apk
