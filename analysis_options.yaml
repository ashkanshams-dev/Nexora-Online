include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    # names are kept identical to the original TypeScript source for easier parity review
    non_constant_identifier_names: ignore
    constant_identifier_names: ignore

linter:
  rules:
    avoid_print: false
    prefer_const_constructors: false
